name: ln-backend

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lecturenote
      POSTGRES_PASSWORD: lecturenote
      POSTGRES_DB: lecturenote
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecturenote -d lecturenote"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage. Identical API to Cloudflare R2 / AWS S3, so the
  # application code is the same locally and in production.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the bucket then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/lecture-note &&
      echo 'bucket ready'
      "

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lecturenote:lecturenote@db:5432/lecturenote
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    env_file:
      - .env
    ports:
      - "8000:8000"
    # Source is mounted so edits reload without rebuilding the image.
    volumes:
      - ./app:/srv/app:ro
      - ./alembic:/srv/alembic:ro
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    profiles: ["full"]

volumes:
  pgdata:
  miniodata:
